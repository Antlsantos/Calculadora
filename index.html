<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mini Calculadora</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculadora">

    <input type="text" id="display" value="0" readonly>

    <div class="botoes">

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="ce" onclick="ce()">CE</button>
        <button class="c" onclick="limpar()">C</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('/')">/</button>
        <button onclick="add('*')">×</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="add('-')">-</button>
        <button class="mais" onclick="add('+')">+</button>

        <button class="zero" onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>

        <button class="sep" onclick="alternarSeparador()">
            Sep. mil
        </button>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
